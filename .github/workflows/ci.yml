name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Type-check
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Build
        run: bun run build

      - name: Lint app folders
        shell: bash
        run: |
          folders=()
          for folder in src/lib src/components/dibs src/components/money src/components/shell src/routes; do
            if [[ -d "$folder" ]]; then
              folders+=("$folder")
            fi
          done
          if (( ${#folders[@]} )); then
            bunx eslint "${folders[@]}"
          fi
